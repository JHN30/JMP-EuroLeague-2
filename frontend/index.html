<!doctype html>
<html lang="en" data-theme="dark-euroleague">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151517" />
    <title>JMP EuroLeague</title>
    <meta name="description" content="Standings, games, teams, players, leaders, comparisons and the postseason bracket for EuroLeague seasons 2023-24 to 2026-27." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JMP EuroLeague" />
    <meta property="og:title" content="JMP EuroLeague" />
    <meta property="og:description" content="Standings, games, teams, players, leaders, comparisons and the postseason bracket for EuroLeague seasons 2023-24 to 2026-27." />
    <meta property="og:image" content="https://www.jmpeuroleague.com/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <script>
      try {
        const saved = localStorage.getItem("euroleague-theme");
        document.documentElement.dataset.theme =
          saved === "light-euroleague" || saved === "dark-euroleague"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light-euroleague"
              : "dark-euroleague";
      } catch {
        document.documentElement.dataset.theme = "dark-euroleague";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
