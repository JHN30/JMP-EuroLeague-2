services:
  # One web service hosts the whole app: the Express API also serves the built frontend
  - type: web
    name: jmp-euroleague
    runtime: node
    plan: starter
    buildCommand: npm run install:ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://www.jmpeuroleague.com
      - key: DB_URL
        sync: false # secret, entered in the Render dashboard
